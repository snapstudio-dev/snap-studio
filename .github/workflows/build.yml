# Snap Studio release: macOS (universal), Windows and Linux.
#
# Manual trigger only, by `scripts/release.sh` (or the "Run workflow" button
# of the Actions tab).
#
# Version: the one of src-tauri/tauri.conf.json, bumped and committed by
# `scripts/release.sh` before the start. The workflow refuses a version
# already published.
#
# Updates: packages are signed with the key from the secrets
# TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD, and the
# release carries `latest.json`, which the installed app reads.
#
# Anonymous usage count (docs/privacy.md): the Aptabase app key, secret
# APTABASE_APP_KEY, is read at build time by the Build step only. Without it
# (a fork, a local build) the app sends nothing.

name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(jq -r .version src-tauri/tauri.conf.json)
          if gh release view "v$v" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::v$v is already published: run scripts/release.sh, which bumps the version."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # The referenced slicing engine should be published. Only a warning:
          # the release's assets are asked of the API, since GitHub's download
          # links sometimes answer 504 for hours.
          if [ -f src-tauri/engine.json ]; then
            for url in $(jq -r '.platforms[].url' src-tauri/engine.json); do
              tag=$(basename "$(dirname "$url")")
              gh release view "$tag" --repo "${{ github.repository }}" --json assets -q '.assets[].name' 2>/dev/null | grep -qxF "$(basename "$url")" \
                || echo "::warning::Engine not found among the assets of $tag: $url (scripts/engine.sh)"
            done
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            name: windows
            args: --bundles nsis
            rust-targets: ""
          - os: ubuntu-22.04
            name: linux-amd64
            arch: amd64
            args: --bundles deb,appimage
            rust-targets: ""
          # GitHub's native ARM runner (Raspberry Pi 4/5, ARM laptops). No
          # slicing engine is published for it yet: the app says so.
          - os: ubuntu-22.04-arm
            name: linux-arm64
            arch: arm64
            args: --bundles deb,appimage
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Update packages enabled here only: a local build, without a signing
      # key, stays possible.
      - name: Build
        working-directory: src-tauri
        env:
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
        run: |
          npx --yes @tauri-apps/cli@^2 build ${{ matrix.args }} \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'

      # The printer simulator is for development builds only (Cargo feature
      # `sim`, docs/DEVELOPMENT.md): neither its server nor its code may
      # reach a release.
      - name: No simulator in the release
        working-directory: src-tauri
        run: |
          if cargo tree -e normal --prefix none | grep -qE '^axum v'; then
            echo "::error::axum, the simulator's server, is among the release's dependencies"
            exit 1
          fi
          bins=$(find target -type f \( -name snap-studio -o -name snap-studio.exe \) -path '*/release/*' -not -path '*/deps/*' -not -path '*/bundle/*')
          [ -n "$bins" ] || { echo "::error::no release binary found"; exit 1; }
          for b in $bins; do
            if grep -aqE 'sim_status|SIMULATED' "$b"; then
              echo "::error::$b carries the printer simulator"
              exit 1
            fi
            echo "$b: no simulator"
          done

      - name: Packages (macOS)
        if: runner.os == 'macOS'
        run: |
          b=src-tauri/target/universal-apple-darwin/release/bundle
          n="Snap-Studio_${VERSION}_macos-universal"
          mkdir -p dist
          cp "$b"/dmg/*.dmg "dist/$n.dmg"
          cp "$b/macos/Snap Studio.app.tar.gz" "dist/$n.app.tar.gz"
          cp "$b/macos/Snap Studio.app.tar.gz.sig" "dist/$n.app.tar.gz.sig"

      - name: Packages (Windows)
        if: runner.os == 'Windows'
        run: |
          b=src-tauri/target/release/bundle/nsis
          n="Snap-Studio_${VERSION}_x64-setup.exe"
          mkdir -p dist
          cp "$b"/*-setup.exe "dist/$n"
          cp "$b"/*-setup.exe.sig "dist/$n.sig"

      - name: Packages (Linux)
        if: runner.os == 'Linux'
        run: |
          b=src-tauri/target/release/bundle
          n="Snap-Studio_${VERSION}_${{ matrix.arch }}"
          mkdir -p dist
          cp "$b"/deb/*.deb "dist/$n.deb"
          cp "$b"/appimage/*.AppImage "dist/$n.AppImage"
          cp "$b"/appimage/*.AppImage.sig "dist/$n.AppImage.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: snap-studio-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Notes: this version's section of CHANGELOG.md (written by
      # scripts/release.sh); otherwise the commits since the previous
      # release. notes-app.md is the same as plain text, for the app's
      # update sheet (latest.json).
      - name: Release notes
        run: |
          if python3 scripts/changelog.py notes "$VERSION" > notes.md; then
            python3 scripts/changelog.py notes "$VERSION" --plain > notes-app.md
            printf '\n[Full changelog](https://github.com/%s/blob/v%s/CHANGELOG.md)\n' "${{ github.repository }}" "$VERSION" >> notes.md
          else
            prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
            if [ -n "$prev" ]; then
              git log "$prev..HEAD" --no-merges --format='- %s' > notes.md
            else
              git log -20 --no-merges --format='- %s' > notes.md
            fi
            [ -s notes.md ] || echo "- Rebuild without changes" > notes.md
            cp notes.md notes-app.md
          fi
          cat notes.md

      # File read by the installed app: one entry per platform, with the
      # package's URL and its signature.
      - name: latest.json
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/v$VERSION"
          mac="Snap-Studio_${VERSION}_macos-universal.app.tar.gz"
          win="Snap-Studio_${VERSION}_x64-setup.exe"
          lin="Snap-Studio_${VERSION}_amd64.AppImage"
          arm="Snap-Studio_${VERSION}_arm64.AppImage"
          jq -n \
            --arg v "$VERSION" \
            --rawfile notes notes-app.md \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mu "$base/$mac" --rawfile ms "dist/$mac.sig" \
            --arg wu "$base/$win" --rawfile ws "dist/$win.sig" \
            --arg lu "$base/$lin" --rawfile ls "dist/$lin.sig" \
            --arg armu "$base/$arm" --rawfile arms "dist/$arm.sig" \
            '{
              version: $v,
              notes: $notes,
              pub_date: $date,
              platforms: {
                "darwin-aarch64": { url: $mu, signature: $ms },
                "darwin-x86_64":  { url: $mu, signature: $ms },
                "windows-x86_64": { url: $wu, signature: $ws },
                "linux-x86_64":   { url: $lu, signature: $ls },
                "linux-aarch64":  { url: $armu, signature: $arms }
              }
            }' > dist/latest.json
          cat dist/latest.json

      - name: Release
        run: |
          gh release create "v$VERSION" $(ls dist/* | grep -v '\.sig$') \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Snap Studio $VERSION" \
            --notes-file notes.md
