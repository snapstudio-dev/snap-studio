.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--control-border); background: var(--control-bg); border-radius: var(--radius-control); padding: 4px 12px; min-height: 28px; font-size: 13px; font-weight: 500; box-shadow: 0 .5px 1px rgba(0,0,0,.08); }

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ data */
const Q = new URLSearchParams(location.search);
const THEME = Q.get('theme') || 'light';

const PRINTING = STATE === 'printing';

// Same source as the #17 Control tab: the spools the printer declares.
const SPOOLS = [
  { t: 'T0', side: 'left',  slot: 'upper', mat: 'PLA',  name: 'Cyan',   hex: '#16b4d8', brand: 'Snapmaker', g: 720, rfid: true },
  { t: 'T1', side: 'left',  slot: 'lower', mat: 'PETG', name: 'Orange', hex: '#ff7a1a', brand: 'Generic',   g: 410, rfid: false },
  { t: 'T2', side: 'right', slot: 'upper', mat: 'PLA',  name: 'White',  hex: '#f1f1ec', brand: 'Snapmaker', g: 880, rfid: true },
  { t: 'T3', side: 'right', slot: 'lower', mat: 'TPU 95A', name: 'Black', hex: '#232326', brand: 'Generic', g: 230, rfid: false },

const ACTIVE = 'T1';
const HEADS = SPOOLS.map((s, i) => ({
  t: s.t, i, temp: PRINTING ? (s.t === ACTIVE ? 244.6 : 170.0) : 27.0 + i * 0.4,

}

}

{

    phys({ color: '#d7e2ea', roughness: 0.04, metalness: 0, transparent: true, opacity: THEME === 'dark' ? 0.16 : 0.13, envMapIntensity: 1.6, clearcoat: 1, depthWrite: false }));
  glass.position.z = D / 2 + 0.05; glass.renderOrder = 5; body.add(glass);
  // glossy diagonal reflection streak
  const streak = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 4.2), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.05, depthWrite: false }));
  streak.rotation.z = -0.55; streak.position.set(-0.4, 1.9, D / 2 + 0.055); streak.renderOrder = 6;

{

  const lg = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.225), new THREE.MeshBasicMaterial({ map: logo, transparent: true }));
  lg.position.set(-1.0, 3.84, D / 2 + 0.032); body.add(lg);

    c.fillStyle = '#121316'; c.fillRect(0, 0, w, h);

      c.fillStyle = '#c9ccd2'; c.font = '600 15px Inter, Arial'; c.fillText(s.t, 50 + i * 70, 148); });
    c.fillStyle = '#1e5eff'; c.beginPath(); c.roundRect(250, 180, 120, 44, 10); c.fill();
    c.fillStyle = '#fff'; c.font = '600 18px Inter, Arial'; c.fillText(PRINTING ? 'Pause' : 'Print', 284, 209);
    c.fillStyle = '#2a2c31'; c.beginPath(); c.roundRect(24, 180, 200, 44, 10); c.fill();
    c.fillStyle = '#3b8cff'; c.fillRect(24, 180, PRINTING ? 124 : 0, 44);
  });
  const bez = new THREE.Mesh(new RoundedBoxGeometry(0.9, 0.56, 0.05, 3, 0.05), std({ color: '#0d0e10', roughness: 0.2, metalness: 0.2 }));
  bez.position.set(1.2, 3.86, D / 2 + 0.03); body.add(bez);
  const sc = new THREE.Mesh(new THREE.PlaneGeometry(0.82, 0.5), new THREE.MeshBasicMaterial({ map: scr, toneMapped: false }));
  sc.material.color.setScalar(0.9);
  sc.position.set(1.2, 3.86, D / 2 + 0.06); body.add(sc);
}

/* ---------------------------------------------------- clickable zones */
const zones = new Map();   // id -> { group, halo:[], mats:[], anchor, info }
function zone(id, group, anchor, info) {
  group.userData.zone = id;
  const mats = [];
  group.traverse(o => {
    if (!o.isMesh || o.userData.noGlow || o.userData.isHalo) return;
    if (Array.isArray(o.material)) { const c = new Map(); o.material = o.material.map(m => { if (!c.has(m)) c.set(m, m.clone()); return c.get(m); }); c.forEach(m => m.emissive && mats.push(m)); }
    else if (o.material.emissive) { o.material = o.material.clone(); mats.push(o.material); }
  });
  const z = { id, group, halo: [], mats, anchor, info };
  zones.set(id, z); return z;
}
function haloMesh(geo, op = 0.92) {
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: ACCENT, side: THREE.BackSide, transparent: true, opacity: 0.0, depthWrite: false }));
  m.visible = false; m.userData.isHalo = true; m.userData.op = op; m.renderOrder = 2; return m;
}

const GY = 3.22;
const carZ = PRINTING ? 0.3 : -0.2, carX = -0.3;
// Bed (lowered when idle, raised under the nozzle while printing).
const bedY = PRINTING ? 1.47 : 1.0;
const bed = new THREE.Group(); bed.position.y = bedY; body.add(bed);
{
  const pei = canvasTex(512, 512, (c, w, h) => {
    const g = c.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#2b2a28'); g.addColorStop(1, '#1f1e1d');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 9000; i++) { c.fillStyle = `rgba(${200 + Math.random() * 40},${170 + Math.random() * 30},120,${Math.random() * 0.07})`; c.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
    c.strokeStyle = 'rgba(210,180,120,0.16)'; c.lineWidth = 1;
    for (let i = 1; i < 9; i++) { c.beginPath(); c.moveTo(i * w / 9, 0); c.lineTo(i * w / 9, h); c.stroke(); c.beginPath(); c.moveTo(0, i * h / 9); c.lineTo(w, i * h / 9); c.stroke(); }
    c.fillStyle = 'rgba(220,190,130,0.35)'; c.font = '600 16px Inter, Arial'; c.fillText('snapmaker · PEI', 18, h - 18);
  });
  const plate = new THREE.Mesh(new RoundedBoxGeometry(2.8, 0.05, 2.8, 2, 0.02), [std({ color: '#2a2928', roughness: 0.75, metalness: 0.2 })][0]);
  plate.material.map = pei; plate.position.y = 0.06;
  const carrier = new THREE.Mesh(new THREE.BoxGeometry(3.1, 0.08, 3.0), alu.clone()); carrier.material.color.set('#7f838a');
  bed.add(carrier, plate);
  if (PRINTING) {
    // the part being printed: a multi-colour vase, 62 % done
    const prof = []; for (let i = 0; i <= 24; i++) { const y = i / 24 * 0.95; prof.push(new THREE.Vector2(0.28 + 0.1 * Math.sin(y * 3.4) + 0.05 * y, y)); }
    const bands = [['#16b4d8', 0, 0.2], ['#ff7a1a', 0.2, 0.38], ['#f1f1ec', 0.38, 0.5], ['#ff7a1a', 0.5, 0.59]];
    for (const [c, a, b] of bands) {
      const pts = prof.filter(p => p.y >= a - 1e-6 && p.y <= b + 1e-6); pts.unshift(new THREE.Vector2(0.0, a)); 
      const geo = new THREE.LatheGeometry(pts, 48);
      const m = new THREE.Mesh(geo, std({ color: c, roughness: 0.55, side: THREE.DoubleSide }));
      m.position.set(carX - 0.4, 0.09, carZ + 0.14); bed.add(m);
    }
  }
  shadowed(bed);
  const halo = haloMesh(new THREE.BoxGeometry(3.25, 0.22, 3.15), 0.7); halo.position.y = 0.04; bed.add(halo);
  const z = zone('bed', bed, new THREE.Vector3(1.4, 0.1, 1.4), {});
  z.halo.push(halo);
}
// Z rods.
for (const x of [-1.6, 1.6]) { const r = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, H - 0.3, 16), alu); r.position.set(x, H / 2, -1.75); body.add(r); }

// CoreXY gantry + 4 heads (docked at the back, the active one on the carriage).
{
  for (const x of [-1.74, 1.74]) { const r = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 3.7), blackAlu); r.position.set(x, GY, 0); body.add(r); }
  const beam = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.12, 0.16), blackAlu); beam.position.set(0, GY, carZ); body.add(beam);
  if (PRINTING) { const car = new THREE.Mesh(new RoundedBoxGeometry(0.66, 0.2, 0.3, 2, 0.04), darkMat); car.position.set(carX, GY - 0.12, carZ + 0.12); body.add(car); }
  const dock = new THREE.Mesh(new THREE.BoxGeometry(3.3, 0.1, 0.2), blackAlu); dock.position.set(0, GY - 0.1, -1.72); body.add(dock);
}
const glowTex = canvasTex(128, 128, (c, w) => { const g = c.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,170,60,1)'); g.addColorStop(0.35, 'rgba(255,110,20,0.45)'); g.addColorStop(1, 'rgba(255,80,0,0)'); c.fillStyle = g; c.fillRect(0, 0, w, w); });
const glows = [];
SPOOLS.forEach((s, i) => {
  const h = new THREE.Group();
  const active = PRINTING && s.t === ACTIVE;
  const dockX = -1.2 + i * 0.8;
  if (active) h.position.set(carX, GY - 0.55, carZ + 0.14); else h.position.set(dockX, GY - 0.52, -1.42);
  const shell = new THREE.Mesh(new RoundedBoxGeometry(0.58, 0.6, 0.5, 3, 0.07), phys({ color: '#e9e9ea', roughness: 0.4, clearcoat: 0.3 }));
  const face = new THREE.Mesh(new RoundedBoxGeometry(0.5, 0.42, 0.04, 2, 0.02), std({ color: '#151618', roughness: 0.3 }));
  face.position.set(0, 0.03, 0.25);
  const lab = canvasTex(128, 96, (c, w, hh) => { c.fillStyle = '#e8e9ec'; c.font = '700 44px Inter, Arial'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(s.t, w / 2, hh / 2 + 4); });
  const label = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.22), new THREE.MeshBasicMaterial({ map: lab, transparent: true }));
  label.position.set(0, 0.06, 0.275); label.userData.noGlow = true;
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.045, 0.02), std({ color: s.hex, roughness: 0.4, emissive: s.hex, emissiveIntensity: 0.25 }));
  stripe.position.set(0, -0.12, 0.275); stripe.userData.noGlow = true;
  const block = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 0.2), alu); block.position.y = -0.35;
  const nozMat = std({ color: '#c99a2e', roughness: 0.25, metalness: 1, emissive: '#ff5a00', emissiveIntensity: 0 });
  const noz = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.12, 20), nozMat); noz.rotation.x = Math.PI; noz.position.y = -0.46; noz.userData.noGlow = true;
  h.add(shell, face, label, stripe, block, noz);
  shadowed(h);
  if (active) {

    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));

  const halo = haloMesh(new RoundedBoxGeometry(0.64, 0.66, 0.56, 3, 0.1), 0.5); h.add(halo);
  const z = zone('head-' + s.t, h, new THREE.Vector3(0, 0.36, 0), { spool: s, i });
  z.halo.push(halo);
});
if (PRINTING) { // empty dock slot of the active head
  const ghost = new THREE.Mesh(new RoundedBoxGeometry(0.58, 0.08, 0.5, 2, 0.03), std({ color: '#55575c', roughness: 0.7 }));
  ghost.position.set(-1.2 + SPOOLS.findIndex(s => s.t === ACTIVE) * 0.8, GY - 0.2, -1.42); body.add(ghost);
}
// Chamber light: LED bar along the top front edge + a light inside.
const ledMat = std({ color: '#ffffff', emissive: '#fff4e0', emissiveIntensity: 2.2, roughness: 0.3 });
const chamberLight = new THREE.PointLight(0xfff1dc, 9, 7, 1.6); chamberLight.position.set(0, 3.6, 0.9); body.add(chamberLight);
{
  const g = new THREE.Group(); g.position.set(0, H - 0.17, D / 2 - 0.22);
  const bar = new THREE.Mesh(new THREE.BoxGeometry(3.3, 0.05, 0.1), ledMat); bar.userData.noGlow = true; g.add(bar);
  const housing = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.08, 0.14), darkMat); housing.position.y = 0.05; g.add(housing);
  body.add(g);
  const halo = haloMesh(new THREE.BoxGeometry(3.5, 0.22, 0.28)); g.add(halo);
  zone('light', g, new THREE.Vector3(1.2, 0, 0), {}).halo.push(halo);
}

// Spools: two per side, upper one at the back, lower one at the front.
function windingsTex() {
  return canvasTex(16, 512, (c, w, h) => {
    for (let y = 0; y < h; y += 4) { const v = 200 + Math.floor(Math.random() * 40); c.fillStyle = `rgb(${v},${v},${v})`; c.fillRect(0, y, w, 2); c.fillStyle = `rgb(${v + 15},${v + 15},${v + 15})`; c.fillRect(0, y + 2, w, 2); }
  });
}
SPOOLS.forEach((s) => {
  const dir = s.side === 'left' ? -1 : 1;
  const g = new THREE.Group();
  const y = s.slot === 'upper' ? 3.0 : 1.22, z = s.slot === 'upper' ? -0.82 : 0.86;
  g.position.set(dir * (W / 2 + 0.47), y, z);
  const axis = new THREE.Group(); axis.rotation.z = Math.PI / 2; g.add(axis);
  const flMat = std({ color: '#d8cfba', roughness: 0.88 });

  const clear = phys({ color: '#f2f4f6', roughness: 0.12, clearcoat: 1, transparent: true, opacity: 0.16, depthWrite: false });
  for (const off of [-0.32, 0.32]) {
    const fl = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 0.035, 72), clear); fl.position.y = off; fl.renderOrder = 3; fl.userData.noGlow = true; axis.add(fl);
    const rimM = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.025, 10, 96), std({ color: '#d9dcdf', roughness: 0.3 })); rimM.rotation.x = Math.PI / 2; rimM.position.y = off; axis.add(rimM);
  }
  const ringTex = canvasTex(512, 512, (c, w) => { c.fillStyle = '#fff'; c.fillRect(0, 0, w, w); for (let r = 92; r < 256; r += 2.2) { const v = 205 + Math.random() * 50; c.strokeStyle = `rgb(${v},${v},${v})`; c.lineWidth = 1.2; c.beginPath(); c.arc(256, 256, r, 0, 7); c.stroke(); } });
  const capMat = phys({ color: s.hex, map: ringTex, roughness: 0.4, clearcoat: 0.4 });
  const map = windingsTex(); map.wrapS = map.wrapT = THREE.RepeatWrapping; map.repeat.set(1, 1);
  const fil = new THREE.Mesh(new THREE.CylinderGeometry(0.86, 0.86, 0.6, 96, 1), [phys({ color: s.hex, map, roughness: 0.38, clearcoat: 0.5, clearcoatRoughness: 0.3 }), capMat, capMat]);
  axis.add(fil);
  const core = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.66, 40), flMat); axis.add(core);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.72, 32), std({ color: '#c4c6ca', roughness: 0.4, metalness: 0.3 })); axis.add(hub);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.15, 0.08, 32), darkMat); cap.position.y = dir * 0.38; axis.add(cap);
  shadowed(g);
  printer.add(g); g.position.y += FEET;
  // holder spindle + round recess on the side panel
  const spindle = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.5, 16), alu); spindle.rotation.z = Math.PI / 2;
  spindle.position.set(dir * (W / 2 + 0.2), y, z); body.add(spindle);
  const rec = new THREE.Mesh(new THREE.CylinderGeometry(1.12, 1.12, 0.02, 72), phys({ color: '#e4e4e5', roughness: 0.5 }));
  rec.rotation.z = Math.PI / 2; rec.position.set(dir * (W / 2 + 0.01), y, z); body.add(rec);
  const halo = haloMesh(new THREE.CylinderGeometry(1.07, 1.07, 0.8, 72)); halo.rotation.z = Math.PI / 2; g.add(halo);
  const zz = zone(s.t, g, new THREE.Vector3(0, 1.0, 0), { spool: s });
  zz.halo.push(halo);
});
// PTFE tubes looping over the top (one per head), with the filament inside.
SPOOLS.forEach((s, i) => {
  const x = -0.45 + i * 0.3;
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(x, H + FEET, -1.2), new THREE.Vector3(x, H + 1.0, -1.15), new THREE.Vector3(x, H + 1.75, -1.0),
    new THREE.Vector3(x, H + 1.95, -1.32), new THREE.Vector3(x, H + 1.7, -1.62), new THREE.Vector3(x, H + 0.9, -1.7), new THREE.Vector3(x, H + FEET, -1.72)]);
  const outer = new THREE.Mesh(new THREE.TubeGeometry(curve, 80, 0.045, 12), phys({ color: '#f4f5f6', roughness: 0.15, transparent: true, opacity: 0.55, clearcoat: 1, depthWrite: false }));
  const inner = new THREE.Mesh(new THREE.TubeGeometry(curve, 80, 0.018, 8), std({ color: s.hex, roughness: 0.5 }));
  inner.castShadow = true; printer.add(inner, outer);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.1, 16), darkMat); base.position.set(x, H + FEET + 0.03, -1.21); printer.add(base);
});

// Ground: soft shadow + contact blob.
{
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: THEME === 'dark' ? 0.45 : 0.16 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const blob = canvasTex(256, 256, (c, w) => { const g = c.createRadialGradient(128, 128, 20, 128, 128, 128); g.addColorStop(0, 'rgba(0,0,0,0.45)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, w, w); });
  const b = new THREE.Mesh(new THREE.PlaneGeometry(8.5, 6.5), new THREE.MeshBasicMaterial({ map: blob, transparent: true, depthWrite: false, opacity: THEME === 'dark' ? 0.9 : 0.55 }));
  b.rotation.x = -Math.PI / 2; b.position.y = 0.002; scene.add(b);
}
body.traverse(o => { if (o.isMesh && !o.userData.isHalo && !(o.material.transparent)) { o.castShadow = true; o.receiveShadow = true; } });

/* ---------------------------------------------------------------- camera */
const VIEWS = { front: 0.2, left: -1.22, right: 1.22 };
const cam = { theta: VIEWS.front, phi: 1.4, dist: 18.5, ty: 2.85, offset: 0 };
const goal = { ...cam };
function applyCamera() {
  const { theta, phi, dist, ty } = cam;
  camera.position.set(Math.sin(phi) * Math.sin(theta) * dist, ty + Math.cos(phi) * dist, Math.sin(phi) * Math.cos(theta) * dist);
  camera.lookAt(0, ty, 0);
  const w = stage.clientWidth, h = stage.clientHeight;
  camera.setViewOffset(w, h, cam.offset, 0, w, h);
}
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ----------------------------------------------------------- interaction */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let hovered = null, selected = null;
const tip = document.getElementById('tip');
function pickAt(cx, cy) {
  const r = canvas.getBoundingClientRect();
  ptr.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(scene.children, true).filter(h => !h.object.userData.isHalo && h.object.visible);
  for (const h of hits) { let o = h.object; while (o && !o.userData.zone) o = o.parent; if (o) return o.userData.zone; if (h.object.material && !h.object.material.transparent) return null; }
  return null;
}
function label(id) {
  const z = zones.get(id); if (!z) return ['', ''];
  if (id === 'bed') return ['Heated bed', `${BED.temp.toFixed(1)} °C${BED.target ? ' → ' + BED.target + ' °C' : ' · off'}`];
  if (id === 'light') return ['Chamber light', lightOn ? 'On' : 'Off'];
  const s = z.info.spool;
  if (id.startsWith('head-')) { const hd = HEADS[z.info.i]; return [`Head ${s.t}`, `${hd.temp.toFixed(1)} °C${hd.target ? ' → ' + hd.target + ' °C' : ''} · ${s.mat}`]; }
  return [`<i class="swatch" style="background:${s.hex}"></i>${s.t} · ${s.name} ${s.mat}`, `${s.side === 'left' ? 'Left' : 'Right'} side · click to turn and open`];
}
function setHover(id) {
  if (hovered === id) return;
  hovered = id; stage.classList.toggle('hovering', !!id);
  document.querySelectorAll('.token').forEach(t => t.classList.toggle('on', t.dataset.id === id || t.dataset.id === selected));
  const [a, b] = label(id); tip.innerHTML = id ? `<b>${a}</b><span>${b}</span>` : ''; tip.classList.toggle('on', !!id);
}
function refreshZones(t) {
  for (const z of zones.values()) {
    const on = z.id === hovered || z.id === selected;
    const strength = 1;
    for (const h of z.halo) { h.visible = on; h.material.opacity = h.userData.op * strength; }
    for (const m of z.mats) { m.emissive.setRGB(1, 1, 1); m.emissiveIntensity = z.id === hovered && z.id !== selected ? 0.05 + 0.02 * Math.sin(t * 4) : 0; }
  }
  if (hovered) {
    const z = zones.get(hovered); const p = z.anchor.clone(); z.group.localToWorld(p); p.project(camera);
    tip.style.left = ((p.x + 1) / 2 * stage.clientWidth) + 'px'; tip.style.top = ((1 - p.y) / 2 * stage.clientHeight) + 'px';
  }
}
let down = null, dragged = false;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, th: goal.theta, ph: goal.phi }; dragged = false; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (down) { const dx = e.clientX - down.x, dy = e.clientY - down.y; if (Math.hypot(dx, dy) > 4) dragged = true;
    if (dragged) { goal.theta = down.th - dx * 0.006; goal.phi = Math.min(1.5, Math.max(0.95, down.ph - dy * 0.004)); setHover(null); setViewBtn(null); return; } }
  setHover(pickAt(e.clientX, e.clientY));
});
canvas.addEventListener('pointerup', e => { if (!dragged) select(pickAt(e.clientX, e.clientY)); down = null; });
canvas.addEventListener('pointerleave', () => setHover(null));
document.getElementById('views').addEventListener('click', e => { const v = e.target.closest('[data-view]'); if (v) { goal.theta = VIEWS[v.dataset.view]; goal.phi = 1.4; setViewBtn(v.dataset.view); } });
function setViewBtn(v) { document.querySelectorAll('#views .seg-btn').forEach(b => b.classList.toggle('on', b.dataset.view === v)); }

/* --------------------------------------------------------------- panels */
const insp = document.getElementById('insp');
const I = {
  close: '<svg viewBox="0 0 24 24"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24"><path d="m9 5.6 1.4-1.4 7.8 7.8-7.8 7.8L9 18.4l6.4-6.4z"/></svg>',
  down: '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6z"/></svg>',
  sliders: '<svg viewBox="0 0 24 24"><path d="M4 6h9v2H4zm13 0h3v2h-3zm-2-2h2v6h-2zM4 16h3v2H4zm7 0h9v2h-9zm-2-2h2v6H9z"/></svg>',
  box: '<svg viewBox="0 0 24 24"><path d="M12 2.5c4 0 7 1.3 7 3v13c0 1.7-3 3-7 3s-7-1.3-7-3v-13c0-1.7 3-3 7-3"/></svg>',
  load: '<svg viewBox="0 0 24 24"><path d="M11 3h2v11.2l3.6-3.6L18 12l-6 6-6-6 1.4-1.4 3.6 3.6zM5 19h14v2H5z"/></svg>',
  unload: '<svg viewBox="0 0 24 24"><path d="M13 21h-2V9.8l-3.6 3.6L6 12l6-6 6 6-1.4 1.4L13 9.8zM5 3h14v2H5z"/></svg>',
  edit: '<svg viewBox="0 0 24 24"><path d="M4 17.2V20h2.8l8.3-8.3-2.8-2.8zm14.7-7.6a.8.8 0 0 0 0-1.1l-1.2-1.2a.8.8 0 0 0-1.1 0l-1.4 1.4 2.3 2.3z"/></svg>',
  flame: '<svg viewBox="0 0 24 24"><path d="M12 2s6 5 6 11a6 6 0 0 1-12 0c0-3 2-5 2-5s0 3 2 4c0-5 2-10 2-10"/></svg>',
};
const links = (focus, inv) => `<div class="links">
  <div class="link">${I.sliders}<span>All controls${focus ? ' · ' + focus : ''}</span>${I.chev}</div>
  ${inv ? `<div class="link">${I.box}<span>View in inventory</span>${I.chev}</div>` : ''}</div>`;
const head = (title) => `<div class="p-float-head"><span class="p-float-title">${title}</span><button class="x-btn" data-close>${I.close}</button></div>`;
function tempBlock(cur, target, max, presets, unit = '°C') {
  const pct = Math.min(100, (target || cur) / max * 100);
  return `<div class="group">
    <div class="row"><span class="k">Current<span class="sub">${target ? 'Heating to ' + target + ' ' + unit : 'Heater off'}</span></span><span class="v mono"><b>${cur.toFixed(1)}</b><span class="muted">${unit}</span></span></div>
    <div class="row"><span class="k">Target</span><span class="v"><span class="select">${target || 'Off'}${target ? ' °C' : ''} ${I.down}</span></span></div>
    <div class="slider"><i style="width:${pct}%"></i><b style="left:${pct}%"></b></div>
    <div class="presets">${presets.map(p => `<span class="preset${p === target || (p === 0 && !target) ? ' on' : ''}">${p ? p + '°' : 'Off'}</span>`).join('')}</div>
  </div>`;
}
function spoolPanel(s) {
  const hd = HEADS[SPOOLS.indexOf(s)], active = PRINTING && s.t === ACTIVE;
  const pct = Math.round(s.g / 1000 * 100);
  return head(`<i class="swatch" style="background:${s.hex}"></i>${s.t} · Spool, ${s.side} side`) + `<div class="p-float-body">
    <div class="group"><div class="hero"><i class="swatch big" style="background:${s.hex}"></i><div><div class="t">${s.name} ${s.mat}</div><div class="s">${s.brand} · ${s.hex.toUpperCase()}${s.rfid ? ' · RFID' : ''}</div></div>${active ? '<span class="tag warn">PRINTING</span>' : '<span class="tag">LOADED</span>'}</div></div>
    <div class="sec">Filament</div>
    <div class="group">
      <div class="row"><span class="k">Material</span><span class="v"><span class="select">${s.mat} ${I.down}</span></span></div>
      <div class="row"><span class="k">Colour</span><span class="v"><i class="swatch" style="background:${s.hex}"></i>${s.name}<span class="select" style="padding:2px 6px">${I.edit}</span></span></div>
      <div class="row"><span class="k">Remaining<span class="sub">${s.rfid ? 'From the RFID tag' : 'Estimated'}</span></span><span class="v"><span class="bar" style="width:84px"><i style="width:${pct}%;background:${s.hex === '#f1f1ec' ? '#c9c9c2' : s.hex}"></i></span>${s.g} g</span></div>
    </div>
    <div class="sec">Linked head</div>
    <div class="group">
      <div class="row"><span class="k">Head ${s.t}<span class="sub">0.4 mm · hardened steel</span></span><span class="v mono"><b>${hd.temp.toFixed(0)}</b><span class="muted">°C</span></span></div>
    </div>
    <div class="sec">Actions</div>
    <div class="btn-row"><button class="btn" data-act="LOAD ${s.t}">${I.load}Load</button><button class="btn" data-act="UNLOAD ${s.t}"${active ? ' disabled style="opacity:.45"' : ''}>${I.unload}Unload</button></div>
    <button class="btn wide" data-act="edit">${I.edit}Edit colour &amp; material</button>
    ${links('head ' + s.t, true)}
  </div>`;
}
function headPanel(z) {
  const s = z.info.spool, hd = HEADS[z.info.i], active = PRINTING && s.t === ACTIVE;
  return head(`<i class="swatch" style="background:${s.hex}"></i>Head ${s.t}`) + `<div class="p-float-body">
    <div class="group"><div class="row"><span class="k">${active ? 'Printing · on the carriage' : PRINTING ? 'Docked · standby' : 'Docked'}<span class="sub">${s.name} ${s.mat} · 0.4 mm</span></span><span class="v">${active ? '<span class="tag warn">ACTIVE</span>' : '<span class="tag">IDLE</span>'}</span></div></div>
    <div class="sec">Nozzle temperature</div>
    ${tempBlock(hd.temp, hd.target, 300, [0, 170, 220, 245])}
    <div class="sec">Filament</div>
    <div class="group"><div class="row"><span class="k"><i class="swatch" style="background:${s.hex};display:inline-block;vertical-align:-2px;margin-right:6px"></i>${s.t} spool · ${s.side} side</span><span class="v muted">${s.g} g</span></div></div>
    ${links('head ' + s.t, false)}
  </div>`;
}
function bedPanel() {
  return head('Heated bed') + `<div class="p-float-body">
    <div class="sec">Bed temperature</div>${tempBlock(BED.temp, BED.target, 110, [0, 55, 65, 80])}
    <div class="group"><div class="row"><span class="k">Plate<span class="sub">Textured PEI</span></span><span class="v muted">Mesh 2 days ago</span></div></div>
    ${links('bed', false)}</div>`;
}
function lightPanel() {
  return head('Chamber light') + `<div class="p-float-body">
    <div class="group"><div class="row"><span class="k">Light<span class="sub">LED bar, top of the chamber</span></span><span class="v"><button class="sw${lightOn ? ' on' : ''}" data-light></button></span></div></div>
    ${links('', false)}</div>`;
}
function select(id) {
  selected = id || null;
  if (!id) { insp.classList.remove('open'); goal.offset = 0; return; }
  setHover(null);
  const z = zones.get(id);
  insp.innerHTML = id === 'bed' ? bedPanel() : id === 'light' ? lightPanel() : id.startsWith('head-') ? headPanel(z) : spoolPanel(z.info.spool);
  insp.classList.add('open');
  goal.offset = 150;
  if (z.info.spool && !id.startsWith('head-')) {
    const left = z.info.spool.side === 'left';
    goal.theta = left ? VIEWS.left : VIEWS.right; goal.phi = 1.36; setViewBtn(left ? 'left' : 'right');
  } else { goal.theta = VIEWS.front; goal.phi = 1.4; setViewBtn('front'); }
  document.querySelectorAll('.token').forEach(t => t.classList.toggle('on', t.dataset.id === id));
}
insp.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) return select(null);
  const l = e.target.closest('[data-light]'); if (l) { lightOn = !lightOn; l.classList.toggle('on', lightOn); return; }
  const a = e.target.closest('[data-act], .link'); if (a) toast('Mockup: nothing is sent to the printer');
});
const toastEl = document.getElementById('toast'); let tt;
function toast(m) { toastEl.textContent = m; toastEl.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('on'), 1600); }

// Status card (top left) and toolbar pill.
document.getElementById('status').innerHTML = (PRINTING
  ? `<div class="p-float-head"><span class="led busy"></span><span class="p-float-title">Printing</span><span>Plate 1</span></div>
     <div class="p-float-body">
      <div class="job">Spiral_vase_3colours_PETG.gcode</div>
      <div class="prog"><span class="pct">62%</span><span class="bar"><i style="width:62%;background:var(--accent)"></i></span></div>
      <div class="chips"><span class="chip">Layer <b>112 / 180</b></span><span class="chip">Left <b>48 min</b></span><span class="chip">${ACTIVE} <b>245 °C</b></span><span class="chip">Bed <b>80 °C</b></span></div>`
  : `<div class="p-float-head"><span class="led ok"></span><span class="p-float-title">Ready</span><span>Chamber 24 °C</span></div>
     <div class="p-float-body">
      <div class="job" style="font-weight:500;color:var(--text-secondary)">No print in progress</div>`)
  + `<div class="tokens">${SPOOLS.map(s => `<span class="token" data-id="${s.t}"><i class="swatch" style="background:${s.hex}"></i>${s.t}<span class="m">${s.mat.split(' ')[0]}</span></span>`).join('')}</div></div>`;
document.getElementById('status').addEventListener('click', e => { const t = e.target.closest('.token'); if (t) select(t.dataset.id); });
document.getElementById('status').addEventListener('mouseover', e => { const t = e.target.closest('.token'); setHover(t ? t.dataset.id : null); });
const pill = document.getElementById('tb-pill'); pill.textContent = PRINTING ? 'Printing' : 'Ready'; pill.className = 'pill ' + (PRINTING ? 'busy' : 'ok');
document.getElementById('side-led').className = 'led ' + (PRINTING ? 'busy' : 'ok');
document.getElementById('side-prints').textContent = PRINTING ? '1' : '';

/* ----------------------------------------------------------------- loop */
const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime(), k = INSTANT ? 1 : 0.075;
  for (const p of ['theta', 'phi', 'dist', 'ty', 'offset']) cam[p] += (goal[p] - cam[p]) * k;
  applyCamera();
  ledMat.emissiveIntensity = lightOn ? 2.2 : 0.05; chamberLight.intensity = lightOn ? 9 : 0;
  for (const g of glows) { const f = 0.85 + 0.15 * Math.sin(t * 3.1); g.sp.material.opacity = f; g.pl.intensity = 2.2 * f; g.nozMat.emissiveIntensity = 1.1 * f; }
  refreshZones(t);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
if (Q.get('select')) select(Q.get('select'));
if (Q.get('hover')) setHover(Q.get('hover'));
applyCamera();
requestAnimationFrame(frame);
setTimeout(() => { window.__ready = true; }, INSTANT ? 600 : 2500);
</script>
</body>
